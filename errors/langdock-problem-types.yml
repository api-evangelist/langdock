description: >-
  Langdock does not use RFC 9457 application/problem+json. Its primary error contract
  is an Anthropic-shaped discriminated union: a top-level envelope {"type":"error",
  "error":{...}} whose inner object is discriminated on an error `type` string. Three
  product families (Usage Export, User Management, Invite Users) use their own simpler
  flat envelopes instead. Both the envelopes and the per-status conditions below are
  derived from the declared 4xx/5xx responses across all 38 operations in the spec.
envelopes:
- name: ErrorResponse
  shape: '{"type": "error", "error": {"type": "<discriminator>", "message": "<string>"}}'
  discriminator: error.type
  used_by: completion, embedding, agent, assistant, attachment, knowledge, skills, audit-log
    operations
- name: UsageExportError
  shape: '{"error": "<string>", "message": "<string>"}'
  used_by: POST /export/* operations
- name: UserManagementError
  shape: '{"message": "<string>"}'
  used_by: POST /user-management/v1/deactivate-user
- name: InviteUsersError
  shape: '{"message": "<string>", "errors": [...], "error": "<string>"}'
  used_by: POST /user-management/v1/invite
  notes: errors[] is present on 400 responses; error is present on 500 responses.
