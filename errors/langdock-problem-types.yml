problems:
- status: 400
  title: Bad Request
  condition: Invalid request parameters, invalid request body, invalid query parameter,
    invalid Skill ID, invalid assistant ID format, invalid form data or zip archive,
    no file provided, or an export date range that is too large.
  operations_declaring: 21
  remediation: Validate the request body and query parameters against the schema before
    retrying; the error message names the offending condition.
- status: 401
  title: Unauthorized
  condition: API key is missing, invalid, or the key creator was not found.
  operations_declaring: 20
  remediation: >-
    Send a valid workspace API key as `Authorization: Bearer sk-ld-...`. Keys are
    managed in Workspace Settings → Products → API.
- status: 403
  title: Forbidden
  condition: >-
    Insufficient API key scope or resource access — requires AGENT_API scope, requires
    AUDIT_LOG_API scope, workspace_id does not match the key's workspace, missing
    Skill create/editor/owner permission, no access to this agent or attachment, or
    the target resource is a project.
  operations_declaring: 11
  remediation: >-
    Grant the required scope to the API key and explicitly share the target agent or
    knowledge folder with that key. See authentication/langdock-authentication.yml.
- status: 404
  title: Not Found
  condition: Agent, Skill, attachment, model, action, or user not found; or no usage
    data found for the selected period.
  operations_declaring: 13
  remediation: Confirm the resource id and that it lives in the API key's workspace.
- status: 409
  title: Conflict
  condition: Skill slug conflict, ambiguous upsert slug, or no draft changes to publish.
  operations_declaring: 4
  remediation: Choose a unique Skill slug, or make draft changes before calling publish.
- status: 413
  title: Payload Too Large
  condition: Uploaded file is too large.
  operations_declaring: 1
  source_operation: openapi/langdock-openapi-original.yml#importSkill
  remediation: Reduce the size of the Skill zip archive before import.
- status: 429
  title: Rate Limit Exceeded
  condition: Per-model request or token rate limit exceeded (default 500 RPM / 60,000
    TPM).
  operations_declaring: 11
  remediation: Back off and retry. BYOK workspaces can raise per-model limits in Settings.
  detail: rate-limits/langdock-rate-limits.yml
- status: 500
  title: Internal Server Error
  condition: Unhandled server-side error.
  operations_declaring: 18
  remediation: Retry with backoff; if persistent, check https://status.langdock.com/.
