              example:
                message: File type not allowed. Detected executable content.
        "413":
          description: File exceeds the size limit
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    description: The file size limit that was exceeded
                    example: File size exceeds the limit. Max size for this file type is 256MB
              example:
                message: File size exceeds the limit. Max size for this file type is 256MB
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    example: You have exceeded the maximum number of requests per minute (500)
              example:
                message: You have exceeded the maximum number of requests per minute (500)
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    example: Internal server error
              example:
                message: Internal server error
