openapi: 3.0.0
info:
  title: Langdock API
  version: 3.0.0
servers:
  - url: https://api.langdock.com
    description: Production
security:
  - bearerAuth: []
paths:
  /openai/{region}/v1/chat/completions:
    post:
      tags:
        - Chat
      summary: Creates a model response for the given chat conversation.
      parameters:
        - name: region
          in: path
          required: true
          description: The region of the API to use.
          schema:
            type: string
            enum: ["eu", "us"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChatCompletionRequest"
            example:
              model: "gpt-4o-mini"
              messages:
                - role: "system"
                  content: "You are a helpful agent."
                - role: "user"
                  content: "Write a short poem about cats."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateChatCompletionResponse"
              example:
                choices:
                  - message:
                      content: "In moonlit shadows soft they prowl,\nWith eyes aglow in night's dark cowl."
                      role: assistant
                    index: 0
                    finish_reason: "stop"
                    logprobs: null
                created: 1721722200
                id: "chatcmpl-8o4sq3sSzGVqS0aQyjlXuuEGVZnSj"
                model: "gpt-4o-2024-05-13"
                object: "chat.completion"
                system_fingerprint: "fp_asd28019bf"
                usage:
                  completion_tokens: 34
                  prompt_tokens: 14
                  total_tokens: 48
      security:
        - bearerAuth: []
  /openai/{region}/v1/responses:
    post:
      tags:
        - Responses
      summary: Creates a stateless model response.
      description: Creates a stateless OpenAI-compatible response. Supports text generation, streaming, and function tools. Do not send store=true, previous_response_id, background=true, or hosted tools.
      operationId: createResponse
      parameters:
        - name: region
          in: path
          required: true
          description: The region of the API to use.
          schema:
            type: string
            enum: ["eu", "us", "global"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - model
                - input
              properties:
                model:
                  type: string
                  description: The model ID. Use the models endpoint to list models available in your workspace.
                input:
                  description: The input text or full conversation state to process.
                  oneOf:
                    - type: string
                    - type: array
                      items: {}
                    - type: object
                      additionalProperties: true
                instructions:
                  type: string
                  nullable: true
                  description: Instructions added to the model context.
                max_output_tokens:
                  type: integer
                  minimum: 1
                  nullable: true
                  description: The maximum number of output tokens.
                temperature:
                  type: number
                  nullable: true
                  description: Controls response randomness.
                top_p:
                  type: number
                  nullable: true
                  description: Controls nucleus sampling.
                stream:
                  type: boolean
                  nullable: true
                  default: false
                  description: Whether to return native Responses API server sent events.
                tools:
                  type: array
                  description: Function tool definitions. Hosted tools are not supported.
                  items:
                    type: object
                    required:
                      - type
                      - name
                    properties:
                      type:
                        type: string
                        enum: ["function"]
                      name:
                        type: string
                        minLength: 1
                      description:
                        type: string
                        nullable: true
                      parameters:
                        type: object
                        nullable: true
                        additionalProperties: true
                      strict:
                        type: boolean
                        nullable: true
                tool_choice:
                  description: Controls whether the model can call a function.
                  oneOf:
                    - type: string
                      enum: ["none", "auto", "required"]
                    - type: object
                      required:
                        - type
                        - name
                      properties:
                        type:
                          type: string
                          enum: ["function"]
                        name:
                          type: string
                          minLength: 1
                parallel_tool_calls:
                  type: boolean
                  nullable: true
                  description: Whether the model can return multiple function calls.
                reasoning:
                  type: object
                  description: OpenAI Responses reasoning configuration.
                  additionalProperties: true
                text:
                  type: object
                  description: OpenAI Responses text output configuration.
                  additionalProperties: true
                metadata:
                  type: object
                  nullable: true
                  description: String metadata attached to the request.
                  additionalProperties:
                    type: string
                store:
                  type: boolean
                  nullable: true
                  enum: [false]
                  description: Responses are not persisted. Omit this field or set it to false.
                background:
                  type: boolean
                  nullable: true
                  enum: [false]
                  description: Background responses are not supported.
                include:
                  type: array
                  nullable: true
                  items:
                    type: string
                  description: Additional response fields to include.
                truncation:
                  type: string
                  nullable: true
                  enum: ["auto", "disabled"]
                service_tier:
                  type: string
                  nullable: true
                  description: The OpenAI service tier forwarded to the model provider.
            example:
              model: "gpt-5-mini"
              input: "Write a short poem about cats."
              store: false
      responses:
        "200":
          description: Successful response or event stream.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateResponseResponse"
              example:
                id: "resp_09e99d1f7f163d10016a678387353481"
                object: "response"
                created_at: 1785168775
                status: "completed"
                model: "gpt-5-mini-2025-08-07"
                output:
                  - id: "rs_09e99d1f7f163d10016a678387f47881"
                    type: "reasoning"
                    content: []
                    summary: []
                  - id: "msg_09e99d1f7f163d10016a67838935a881"
                    type: "message"
                    status: "completed"
                    role: "assistant"
                    content:
                      - type: "output_text"
                        annotations: []
                        logprobs: []
                        text: "Whiskers sketch moonlight on the sill,\npaws treading silence, soft and still.\nEyes like lanterns, sly and bright,\nturning midnight into light.\nA velvet sigh, a sudden purr—\nthe world made small, the heart made her."
                usage:
                  input_tokens: 13
                  input_tokens_details:
                    cached_tokens: 0
                  output_tokens: 154
                  output_tokens_details:
                    reasoning_tokens: 64
                  total_tokens: 167
            text/event-stream:
              schema:
                type: string
                description: Native OpenAI Responses API server sent events.
        "400":
          description: Invalid fields, unsupported features, or an unavailable model.
        "401":
          description: Missing, invalid, or expired API key.
        "403":
          description: API key without the Completion API scope.
        "413":
          description: Request body exceeds 20 MB.
        "429":
          description: Usage or rate limit exceeded.
        "500":
          description: Internal server or upstream provider error.
        default:
          description: Error returned by the upstream model provider.
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - message
                      - type
                    properties:
                      message:
                        type: string
                      type:
                        type: string
                      code:
                        type: string
                        nullable: true
                      param:
                        type: string
                        nullable: true
      security:
        - bearerAuth: []
  /openai/{region}/v1/images/generations:
    post:
      tags:
        - Images
      summary: Generates one standard image as base64.
      description: Generates one standard-resolution image with a Completion API key. Returns b64_json only. Does not support n other than 1, URL output, HD, or image edits.
      operationId: createImage
      parameters:
        - name: region
          in: path
          required: true
          description: The region of the API to use. Must be eu or us.
          schema:
            type: string
            enum: ["eu", "us"]
            default: eu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - model
                - prompt
              properties:
                model:
                  type: string
                  minLength: 1
                  description: Image generation model ID from your workspace. GET /openai/{region}/v1/models lists chat models, not image models.
                prompt:
                  type: string
                  minLength: 1
                  description: The image description.
                n:
                  type: integer
                  enum: [1]
                  description: Number of images. Only 1 is supported.
                size:
                  type: string
                  enum: ["auto", "1024x1024", "1536x1024", "1024x1536"]
                  default: auto
                  description: Output size. auto and 1024x1024 map to square, 1536x1024 to landscape, and 1024x1536 to portrait.
                quality:
                  type: string
                  enum: ["auto", "low", "medium", "high"]
                  description: Quality hint forwarded to the image model. Not every image model uses it.
                response_format:
                  type: string
                  enum: ["b64_json"]
                  description: Response format. Only b64_json is supported.
                user:
                  type: string
                  description: Optional end-user identifier. Accepted for OpenAI compatibility.
            example:
              model: "your-image-model-id"
              prompt: "A lighthouse at dusk"
              n: 1
              size: "1024x1024"
              response_format: "b64_json"
      responses:
        "200":
          description: OK
          headers:
            ld-model-id:
              description: The image model ID used for the request.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                  - created
                  - data
                properties:
                  created:
                    type: integer
                    description: Unix timestamp in seconds.
                  data:
                    type: array
                    minItems: 1
                    maxItems: 1
                    items:
                      type: object
                      required:
                        - b64_json
                      properties:
                        b64_json:
                          type: string
                          description: Base64-encoded image.
                        revised_prompt:
                          type: string
                          description: Revised prompt when the model returns one.
              example:
                created: 1721722200
                data:
                  - b64_json: "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=="
                    revised_prompt: "A coastal lighthouse at dusk, warm lantern light."
        "400":
          description: Invalid fields, an unavailable image model, or no image models in the region.
        "401":
          description: Missing, invalid, or expired API key.
        "403":
          description: API key without the Completion API scope.
        "429":
          description: Usage or rate limit exceeded.
        "504":
          description: The model did not respond in time. Please retry.
        "500":
          description: Internal server or upstream provider error.
      security:
        - bearerAuth: []
  /openai/{region}/v1/embeddings:
    post:
      tags:
        - Embeddings
      summary: Creates embeddings for the given input text.
      parameters:
        - name: region
          in: path
          required: true
          description: The region of the API to use.
          schema:
            type: string
            enum: ["eu", "us"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmbeddingRequest"
            example:
              model: "text-embedding-ada-002"
              input: "The quick brown fox jumps over the lazy dog"
              encoding_format: "float"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateEmbeddingResponse"
              example:
                data:
                  - embedding: [0.0023064255, -0.009327292, ...]
                    index: 0
                    object: "embedding"
                model: "text-embedding-ada-002"
                object: "list"
                usage:
                  prompt_tokens: 9
                  total_tokens: 9
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    oneOf:
                      - example: "No embedding models available for the ${region} region"
                description: Error message indicating either no models are available in the region or the requested model is not available
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "The provided API key is invalid."
        "429":
          description: Rate Limit Exceeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Rate limit for public API exceeded"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Internal Server Error"
      security:
        - bearerAuth: []
  /anthropic/{region}/v1/messages:
    post:
      tags:
        - Messages
      summary: Create a Message
      description: |-
        Create a Message.

        Send a structured list of input messages with text and/or image content, and the model will generate the next message in the conversation.

        The Messages API can be used for either single queries or stateless multi-turn conversations.
      parameters:
        - name: region
          in: path
          required: true
          description: The region of the API to use.
          schema:
            type: string
            enum: ["eu", "us"]
      operationId: messages_post
      responses:
        "200":
          description: Message object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        4XX:
          description: |-
            Error response.

            See Anthropic's [errors documentation](https://platform.claude.com/docs/en/api/errors) for more details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: The model did not respond in time on a non-streaming request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: The model did not respond in time. Please retry.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageParams"
        required: true
      security:
        - bearerAuth: []
  /mistral/{region}/v1/fim/completions:
    post:
      summary: Fim Completion
      description: FIM completion.
      parameters:
        - name: region
          in: path
          required: true
          description: The region of the API to use.
          schema:
            type: string
            enum: ["eu"]
      operationId: fim_completion_v1_fim_completions_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FIMCompletionRequest"
            example:
              model: "codestral-2501"
              prompt: "function removeSpecialCharactersWithRegex(str: string) {"
              max_tokens: 64
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FIMCompletionResponse" }
              example:
                data: "asd"
                id: "245c52bc936f53ba90327800c73d1c3e"
                object: "chat.completion"
                model: "codestral"
                usage:
                  prompt_tokens: 16
                  completion_tokens: 102
                  total_tokens: 118
                created: 1732902806
                choices:
                  - index: 0
                    message:
                      content: "\n  // Use a regular expression to match any non-alphanumeric character and replace it with an empty string\n  return str.replace(/[^a-zA-Z0-9]/g, '');\n}\n\n// Test the function\nconst inputString = \"Hello, World! 123\";\nconst outputString = removeSpecialCharactersWithRegex(inputString);\nconsole.log(outputString); // Output: \"HelloWorld123\""
                      prefix: false
                      role: "assistant"
                    finish_reason: "stop"
            text/event-stream:
              schema:
                $ref: "#/components/schemas/CompletionEvent"
      tags:
        - fim
  /google/{region}/v1beta/models/{model}:generateContent:
    post:
      tags:
        - Google
      summary: Generate Content
      description: |-
        Generate content using Google Gemini models.
        This endpoint mirrors the structure of the official Vertex AI generateContent API while adding API-key based authentication and region selection.
      parameters:
        - name: region
          in: path
          required: true
          description: The region of the API to use.
          schema:
            type: string
            enum: ["eu", "us"]
        - name: model
          in: path
          required: true
          description: The model ID (e.g., gemini-2.5-pro, gemini-2.5-flash).
          schema:
            type: string
      operationId: google_generate_content_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contents:
                  type: array
                  description: Conversation history. Parts may be text, functionCall, or functionResponse.
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                        enum: ["user", "model"]
                      parts:
                        type: array
                        items:
                          type: object
                          properties:
                            text:
                              type: string
                            thoughtSignature:
                              type: string
                              description: Return unchanged on the follow-up turn (required for Gemini 3).
                            functionCall:
                              type: object
                              properties:
                                name:
                                  type: string
                                args:
                                  type: object
                                id:
                                  type: string
                                  description: Return unchanged on the follow-up turn (required for Gemini 3).
                            functionResponse:
                              type: object
                              properties:
                                name:
                                  type: string
                                response:
                                  type: object
                                id:
                                  type: string
                                  description: Return unchanged on the follow-up turn (required for Gemini 3).
              required:
                - contents
            example:
              contents:
                - role: "user"
                  parts:
                    - text: "Write a short haiku about the ocean."
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  candidates:
                    type: array
                    items:
                      type: object
                      properties:
                        content:
                          type: object
                        finishReason:
                          type: string
                  usageMetadata:
                    type: object
        4XX:
          description: Error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
  /knowledge:
    get:
      summary: List Knowledge bases accessible to the API key
      parameters:
        - name: limit
          in: query
          required: false
          description: Number of Knowledge bases to return. Default 50. Maximum 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          description: UUID of the last Knowledge base from the previous page
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Knowledge bases retrieved successfully
      security:
        - bearerAuth: []
  /knowledge/{folderId}/access:
    post:
      summary: Grant Knowledge base access to people or workspace API keys
      parameters:
        - name: folderId
          in: path
          required: true
          description: The ID of the knowledge folder
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - targetIds
                - role
              properties:
                targetIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  minItems: 1
                  maxItems: 100
                role:
                  type: string
                  enum:
                    - USER
                    - EDITOR
      responses:
        "200":
          description: Access granted successfully
      security:
        - bearerAuth: []
    patch:
      summary: Change Knowledge base access for a person or workspace API key
      parameters:
        - name: folderId
          in: path
          required: true
          description: The ID of the knowledge folder
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - targetId
                - role
              properties:
                type:
                  type: string
                  enum:
                    - USER
                    - API_KEY
                targetId:
                  type: string
                  format: uuid
                role:
                  type: string
                  enum:
                    - USER
                    - EDITOR
      responses:
        "200":
          description: Access updated successfully
      security:
        - bearerAuth: []
    delete:
      summary: Revoke Knowledge base access for a person or workspace API key
      parameters:
        - name: folderId
          in: path
          required: true
          description: The ID of the knowledge folder
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - targetId
              properties:
                type:
                  type: string
                  enum:
                    - USER
                    - API_KEY
                targetId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Access revoked successfully
      security:
        - bearerAuth: []
  /knowledge/{folderId}/folder:
    patch:
      summary: Update a Knowledge base name or description
      parameters:
        - name: folderId
          in: path
          required: true
          description: The ID of the knowledge folder
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        "200":
          description: Knowledge base updated successfully
      security:
        - bearerAuth: []
  /knowledge/search:
    post:
      summary: Search through all files in data folders shared with the API Key
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                  description: The search query
                  example: "API Documentation"
      responses:
        "200":
          description: Successfully found search result
      security:
        - bearerAuth: []
  /knowledge/{folderId}:
    post:
      summary: Upload a file to a knowledge folder
      parameters:
        - name: folderId
          in: path
          required: true
          description: The ID of the knowledge folder
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload
                url:
                  type: string
                  description: The associated URL
      responses:
        "200":
          description: File uploaded successfully
        "400":
          description: Invalid request or file validation failed
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    additionalProperties: false
                    required:
                      - message
                      - code
                    properties:
                      message:
                        type: string
                        example: The file "quarterly-report.pdf" is declared as a PDF but its content does not start with the expected PDF header.
                      code:
                        type: string
                        enum:
                          - BAD_REQUEST
                  - type: object
                    additionalProperties: false
                    required:
                      - message
                      - errors
                    properties:
                      message:
                        type: string
                        example: Invalid request
                      errors:
                        type: array
                        items:
                          type: object
        "401":
          description: Invalid or missing API key
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    example: The provided API key is invalid.
        "403":
          description: API key does not have access to the knowledge folder
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    additionalProperties: false
                    required:
                      - message
                      - code
                    properties:
                      message:
                        type: string
                        example: Knowledge folder not shared with this API key. Please share the folder with the API key in the Langdock App to upload or update files.
                      code:
                        type: string
                        enum:
                          - FORBIDDEN
                  - type: object
                    additionalProperties: false
                    required:
                      - message
                      - error
                      - details
                    properties:
                      message:
                        type: string
                        example: Insufficient API key permissions.
                      error:
                        type: string
                        enum:
                          - INSUFFICIENT_SCOPES
                      details:
                        type: object
                        required:
                          - required
                          - missing
                        properties:
                          required:
                            type: array
                            items:
                              type: string
                              example: KNOWLEDGE_FOLDER_API
                          missing:
                            type: array
                            items:
                              type: string
                              example: KNOWLEDGE_FOLDER_API
                  - type: object
                    additionalProperties: false
                    required:
                      - message
                    properties:
                      message:
                        type: string
                        example: Forbidden
        "404":
          description: Knowledge folder not found
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - code
                properties:
                  message:
                    type: string
                    example: Knowledge folder not found
                  code:
                    type: string
                    enum:
                      - NOT_FOUND
        "408":
          description: Upload timed out
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - code
                properties:
                  message:
                    type: string
                    example: Upload request timed out. Please try again with a smaller file or check your connection.
                  code:
                    type: string
                    enum:
                      - REQUEST_TIMEOUT
        "413":
          description: File exceeds the size limit
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - code
                properties:
                  message:
                    type: string
                    example: File size exceeds the maximum allowed size of 256MB. Please upload a smaller file.
                  code:
                    type: string
                    enum:
                      - PAYLOAD_TOO_LARGE
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    example: You have exceeded the maximum number of requests per minute (50)
                  code:
                    type: string
                    enum:
                      - TOO_MANY_REQUESTS
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    example: Internal server error
        "503":
          description: Storage capacity exceeded
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - code
                properties:
                  message:
                    type: string
                    example: Storage capacity exceeded. Please contact your administrator.
                  code:
                    type: string
                    enum:
                      - SERVICE_UNAVAILABLE
      security:
        - bearerAuth: []
    patch:
      summary: Update a file in a knowledge folder
      parameters:
        - name: folderId
          in: path
          required: true
          description: The ID of the knowledge folder
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The new file to upload
                url:
                  type: string
                  description: URL that is shown to the user if the file is used in an answer
                attachmentId:
                  type: string
                  description: The ID of the attachment to update
      responses:
        "200":
          description: Attachment updated successfully
        "400":
          description: Invalid request or file validation failed
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    additionalProperties: false
                    required:
                      - message
                      - code
                    properties:
                      message:
                        type: string
                        example: The file "updated-report.pdf" is declared as a PDF but its content does not start with the expected PDF header.
                      code:
                        type: string
                        enum:
                          - BAD_REQUEST
                  - type: object
                    additionalProperties: false
                    required:
                      - message
                      - errors
                    properties:
                      message:
                        type: string
                        example: Invalid request
                      errors:
                        type: array
                        items:
                          type: object
        "401":
          description: Invalid or missing API key
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    example: The provided API key is invalid.
        "403":
