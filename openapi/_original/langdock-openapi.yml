        text:
          minLength: 1
          title: Text
          type: string
        cache_control:
          allOf:
            - $ref: "#/components/schemas/CacheControlEphemeral"
          title: Cache Control
      required:
        - type
        - text
      title: Text
      type: object
    RequestToolResultBlock:
      additionalProperties: false
