            - items:
                discriminator:
                  mapping:
                    image: "#/components/schemas/RequestImageBlock"
                    text: "#/components/schemas/RequestTextBlock"
                  propertyName: type
                oneOf:
                  - $ref: "#/components/schemas/RequestTextBlock"
                  - $ref: "#/components/schemas/RequestImageBlock"
              type: array
              x-stainless-naming:
                python:
                  type_name: Content
          title: Content
        cache_control:
          allOf:
            - $ref: "#/components/schemas/CacheControlEphemeral"
          title: Cache Control
      required:
        - type
        - tool_use_id
      title: Tool Result
      type: object
    RequestToolUseBlock:
      additionalProperties: false
      properties:
        type:
          enum:
            - tool_use
          title: Type
          type: string
        id:
          pattern: ^[a-zA-Z0-9_-]+$
          title: Id
          type: string
        name:
          maxLength: 64
          minLength: 1
          pattern: ^[a-zA-Z0-9_-]{1,64}$
          title: Name
          type: string
        input:
          title: Input
          type: object
        cache_control:
          allOf:
            - $ref: "#/components/schemas/CacheControlEphemeral"
          title: Cache Control
      required:
        - type
        - id
        - name
        - input
      title: Tool Use
      type: object
    ResponseTextBlock:
      properties:
        type:
          default: text
          enum:
            - text
          title: Type
          type: string
        text:
          maxLength: 5000000
          minLength: 0
          title: Text
          type: string
      required:
        - type
        - text
      title: Text
      type: object
    ResponseToolUseBlock:
      properties:
        type:
          default: tool_use
          enum:
            - tool_use
          title: Type
          type: string
        id:
          pattern: ^[a-zA-Z0-9_-]+$
          title: Id
          type: string
        name:
          minLength: 1
          title: Name
          type: string
        input:
          title: Input
          type: object
      required:
        - type
        - id
        - name
        - input
      title: Tool Use
      type: object
    Tool:
      additionalProperties: false
      properties:
        description:
          description: |-
            Description of what this tool does.

            Tool descriptions should be as detailed as possible. The more information that the model has about what the tool is and how to use it, the better it will perform. You can use natural language descriptions to reinforce important aspects of the tool input JSON schema.
          example:
            - Get the current weather in a given location
          title: Description
          type: string
        name:
          maxLength: 64
          minLength: 1
          pattern: ^[a-zA-Z0-9_-]{1,64}$
          title: Name
          type: string
        input_schema:
          allOf:
            - $ref: "#/components/schemas/InputSchema"
          description: |-
            [JSON schema](https://json-schema.org/) for this tool's input.

            This defines the shape of the `input` that your tool accepts and that the model will produce.
          example:
            - properties:
                location:
                  description: The city and state, e.g. San Francisco, CA
                  type: string
                unit:
                  description: Unit for the output - one of (celsius, fahrenheit)
                  type: string
              required:
                - location
              type: object
        cache_control:
          allOf:
            - $ref: "#/components/schemas/CacheControlEphemeral"
          title: Cache Control
      required:
        - name
        - input_schema
      title: Tool
      type: object
    ToolChoiceAny:
      additionalProperties: false
      description: The model will use any available tools.
      properties:
        type:
          enum:
            - any
          title: Type
          type: string
      required:
        - type
      title: ToolChoiceAny
      type: object
    ToolChoiceAuto:
      additionalProperties: false
      description: The model will automatically decide whether to use tools.
      properties:
        type:
          enum:
            - auto
          title: Type
          type: string
      required:
        - type
      title: ToolChoiceAuto
      type: object
    ToolChoiceTool:
      additionalProperties: false
      description: The model will use the specified tool with `tool_choice.name`.
      properties:
        type:
          enum:
            - tool
          title: Type
          type: string
        name:
          description: The name of the tool to use.
          title: Name
          type: string
      required:
        - type
        - name
      title: ToolChoiceTool
      type: object
    Usage:
      properties:
        input_tokens:
          description: The number of input tokens which were used.
          example:
            - 2095
          title: Input Tokens
          type: integer
        output_tokens:
          description: The number of output tokens which were used.
          example:
            - 503
          title: Output Tokens
          type: integer
        cache_creation_input_tokens:
          description: The number of input tokens written to the cache when creating a new cache entry.
          example:
            - 2051
          title: Cache Creation Input Tokens
          type: integer
        cache_read_input_tokens:
          description: The number of input tokens read from the cache.
          example:
            - 2051
          title: Cache Read Input Tokens
          type: integer
      required:
        - input_tokens
        - output_tokens
      title: Usage
      type: object
    ContentBlock:
      discriminator:
        mapping:
          text: "#/components/schemas/ResponseTextBlock"
          tool_use: "#/components/schemas/ResponseToolUseBlock"
          thinking: "#/components/schemas/ResponseThinkingBlock"
        propertyName: type
      oneOf:
        - $ref: "#/components/schemas/ResponseTextBlock"
        - $ref: "#/components/schemas/ResponseToolUseBlock"
        - $ref: "#/components/schemas/ResponseThinkingBlock"
    ResponseThinkingBlock:
      type: object
      description: A thinking content block containing Claude's reasoning process when extended thinking is enabled.
      properties:
        type:
          type: string
          enum: ["thinking"]
          description: The type of content block.
        thinking:
          type: string
          description: Claude's internal reasoning process.
        signature:
          type: string
          description: A signature verifying the thinking block's authenticity.
      required:
        - type
        - thinking
    ThinkingConfig:
      type: object
      title: Thinking
      description: |-
        Configuration for enabling Claude's extended thinking. When enabled, responses include `thinking` content blocks showing Claude's reasoning process before the final answer.

        See [extended thinking](https://platform.claude.com/docs/en/build-with-claude/extended-thinking) for details.
      properties:
        type:
          type: string
          enum: ["enabled"]
          description: Must be "enabled" to activate extended thinking.
        budget_tokens:
          type: integer
          minimum: 1024
          description: Maximum number of tokens Claude can use for thinking. Must be ≥1024 and less than max_tokens.
      required:
        - type
        - budget_tokens
    Model:
      title: Model
      description: The model that will complete your prompt.
        See [models](https://platform.claude.com/docs/en/docs/models-overview) for additional details and options.
      type: string
    #============== Mistral schemas ==============
    AssistantMessage:
      properties:
        content:
          title: Content
          anyOf:
            - type: string
            - items:
                $ref: "#/components/schemas/ContentChunk"
              type: array
        tool_calls:
          anyOf:
            - items:
                $ref: "#/components/schemas/ToolCall"
              type: array
          title: Tool Calls
        prefix:
          type: boolean
          title: Prefix
          default: false
        role:
          type: string
          default: assistant
          title: Role
          enum:
            - assistant
      additionalProperties: false
      type: object
      title: AgentMessage
    FIMCompletionRequest:
      properties:
        model:
          anyOf:
            - type: string
          title: Model
          default: codestral-2501
          description: |-
            ID of the model to use. Only compatible for now with:
              - `codestral-2501`
        temperature:
          anyOf:
            - type: number
              maximum: 1.5
              minimum: 0
          title: Temperature
          description: What sampling temperature to use, we recommend between 0.0 and 0.7. Higher values like 0.7 will make the output more random, while lower values like 0.2 will make it more focused and deterministic. We generally recommend altering this or `top_p` but not both. The default value varies depending on the model you are targeting. Call the `/models` endpoint to retrieve the appropriate value.
        top_p:
          type: number
          maximum: 1
          minimum: 0
          title: Top P
          default: 1
          description: Nucleus sampling, where the model considers the results of the tokens with `top_p` probability mass. So 0.1 means only the tokens comprising the top 10% probability mass are considered. We generally recommend altering this or `temperature` but not both.
        max_tokens:
          anyOf:
            - type: integer
              minimum: 0
          title: Max Tokens
          description: The maximum number of tokens to generate in the completion. The token count of your prompt plus `max_tokens` cannot exceed the model's context length.
        stream:
          type: boolean
          title: Stream
          default: false
          description: "Whether to stream back partial progress. If set, tokens will be sent as data-only server-side events as they become available, with the stream terminated by a data: [DONE] message. Otherwise, the server will hold the request open until the timeout or until completion, with the response containing the full result as JSON."
        stop:
          anyOf:
            - type: string
            - items:
                type: string
              type: array
          title: Stop
          description: Stop generation if this token is detected. Or if one of these tokens is detected when providing an array
        random_seed:
          anyOf:
            - type: integer
              minimum: 0
          title: Random Seed
          description: The seed to use for random sampling. If set, different calls will generate deterministic results.
        prompt:
          type: string
          title: Prompt
          description: The text/code to complete.
        suffix:
          anyOf:
            - type: string
          title: Suffix
          default: ""
          description: Optional text/code that adds more context for the model. When given a `prompt` and a `suffix` the model will fill what is between them. When `suffix` is not provided, the model will simply execute completion starting with `prompt`.
        min_tokens:
          anyOf:
            - type: integer
              minimum: 0
          title: Min Tokens
          description: The minimum number of tokens to generate in the completion.
      additionalProperties: false
      type: object
      required:
        - prompt
        - model
      title: FIMCompletionRequest
    FunctionCall:
      properties:
        name:
          type: string
          title: Name
        arguments:
          title: Arguments
          anyOf:
            - type: object
              additionalProperties: true
            - type: string
      additionalProperties: false
      type: object
      required:
        - name
        - arguments
      title: FunctionCall
    ImageURL:
      properties:
        url:
          type: string
          title: Url
        detail:
          anyOf:
            - type: string
          title: Detail
      additionalProperties: false
      type: object
      required:
        - url
      title: ImageURL
    ImageURLChunk:
      properties:
        type:
          type: string
          enum:
            - image_url
          title: Type
          default: image_url
        image_url:
          anyOf:
            - $ref: "#/components/schemas/ImageURL"
            - type: string
          title: Image Url
      additionalProperties: false
      type: object
      required:
        - image_url
      title: ImageURLChunk
      description: '{"type":"image_url","image_url":{"url":"data:image/png;base64,iVBORw0'
    TextChunk:
      properties:
        type:
          type: string
          enum:
            - text
          title: Type
          default: text
        text:
          type: string
          title: Text
      additionalProperties: false
      type: object
      required:
        - text
      title: TextChunk
    ToolCall:
      properties:
        id:
          type: string
          title: Id
          default: "null"
        type:
          $ref: "#/components/schemas/ToolTypes"
          default: function
        function:
          $ref: "#/components/schemas/FunctionCall"
      additionalProperties: false
      type: object
      required:
        - function
      title: ToolCall
    ToolTypes:
      type: string
      enum:
        - function
      title: ToolTypes
    ContentChunk:
      oneOf:
        - $ref: "#/components/schemas/TextChunk"
        - $ref: "#/components/schemas/ImageURLChunk"
      discriminator:
        propertyName: type
        mapping:
          image_url: "#/components/schemas/ImageURLChunk"
          text: "#/components/schemas/TextChunk"
      title: ContentChunk
    UsageInfo:
      title: UsageInfo
      type: object
      properties:
        prompt_tokens:
          type: integer
          example: 16
        completion_tokens:
          type: integer
          example: 34
        total_tokens:
          type: integer
          example: 50
      required:
        - prompt_tokens
        - completion_tokens
        - total_tokens
    ResponseBase:
      type: object
      title: ResponseBase
      properties:
        id:
          type: string
          example: cmpl-e5cc70bb28c444948073e77776eb30ef
        object:
          type: string
          example: chat.completion
        model:
          type: string
          example: mistral-small-latest
        usage:
          $ref: "#/components/schemas/UsageInfo"
    ChatCompletionChoice:
      title: ChatCompletionChoice
      type: object
      required:
        - index
        - finish_reason
        - message
      properties:
        index:
          type: integer
          example: 0
        message:
          $ref: "#/components/schemas/AssistantMessage"
        finish_reason:
          type: string
          enum:
            - stop
            - length
            - model_length
            - error
            - tool_calls
          example: stop
    DeltaMessage:
      title: DeltaMessage
      type: object
      properties:
        role:
          anyOf:
            - type: string
        content:
          anyOf:
            - type: string
            - items:
                $ref: "#/components/schemas/ContentChunk"
              type: array
        tool_calls:
          anyOf:
            - type: array
              items:
                $ref: "#/components/schemas/ToolCall"
    ChatCompletionResponseBase:
      allOf:
        - $ref: "#/components/schemas/ResponseBase"
        - type: object
          title: ChatCompletionResponseBase
          properties:
            created:
              type: integer
              example: 1702256327
    ChatCompletionResponse:
      allOf:
        - $ref: "#/components/schemas/ChatCompletionResponseBase"
        - type: object
          title: ChatCompletionResponse
          properties:
            choices:
              type: array
              items:
                $ref: "#/components/schemas/ChatCompletionChoice"
          required:
            - id
            - object
            - data
            - model
            - usage
    FIMCompletionResponse:
      allOf:
        - $ref: "#/components/schemas/ChatCompletionResponse"
        - type: object
          properties:
            model:
              type: string
              example: codestral-latest
    CompletionEvent:
      title: CompletionEvent
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/CompletionChunk"
    CompletionChunk:
      title: CompletionChunk
      type: object
      required:
        - id
        - model
        - choices
      properties:
        id:
          type: string
        object:
          type: string
        created:
          type: integer
        model:
          type: string
        usage:
          $ref: "#/components/schemas/UsageInfo"
        choices:
          type: array
          items:
            $ref: "#/components/schemas/CompletionResponseStreamChoice"
    CompletionResponseStreamChoice:
      title: CompletionResponseStreamChoice
      type: object
      required:
        - index
        - delta
        - finish_reason
      properties:
        index:
          type: integer
        delta:
          $ref: "#/components/schemas/DeltaMessage"
        finish_reason:
          type: string
          enum:
            - stop
            - length
            - error
            - tool_calls
    CreateEmbeddingRequest:
      type: object
      properties:
        input:
          description: Input text to get embeddings for, encoded as a string or array of tokens. To get embeddings for multiple inputs in a single request, pass an array of strings or array of tokens, e.g. `["text1", "text2"]`. Each input must not exceed 8192 tokens in length.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
            - type: array
              items:
                type: number
            - type: array
              items:
                type: array
                items:
                  type: number
        model:
          description: ID of the model to use. You can use the [List models](https://platform.openai.com/docs/api-reference/models/list) API to see all of your available models, or see OpenAI's [Model overview](https://platform.openai.com/docs/models/overview) for descriptions of them.
          oneOf:
            - type: string
            - type: string
              enum:
                [
                  "text-embedding-ada-002",
                  "text-embedding-3-small",
                  "text-embedding-3-large",
                ]
        encoding_format:
          description: The format to return the embeddings in. Can be either `float` or `base64`.
          type: string
          enum: ["float", "base64"]
          default: "float"
        dimensions:
          description: The number of dimensions the resulting output embeddings should have. Only supported in `text-embedding-3` and later models.
          type: integer
          minimum: 1
        user:
          description: A unique identifier representing your end-user, which can help OpenAI to monitor and detect abuse.
          type: string
      required:
        - model
        - input
    Embedding:
      type: object
      properties:
        index:
          type: integer
          description: The index of the embedding in the list of embeddings.
        embedding:
          type: array
          items:
            type: number
          description: The embedding vector, which is a list of floats. The length of vector depends on the model as listed in the [embedding guide](https://platform.openai.com/docs/guides/embeddings).
        object:
          type: string
          enum: ["embedding"]
          description: The object type, which is always "embedding".
      required:
        - index
        - embedding
        - object
    CreateEmbeddingResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Embedding"
          description: The list of embeddings generated by the model.
        model:
          type: string
          description: The name of the model used to generate the embedding.
        object:
          type: string
          enum: ["list"]
          description: The object type, which is always "list".
        usage:
          type: object
          properties:
            prompt_tokens:
              type: integer
              description: The number of tokens used for the prompt(s).
            total_tokens:
              type: integer
              description: The total number of tokens used by the request.
          required:
            - prompt_tokens
            - total_tokens
      required:
        - data
        - model
        - object
        - usage
    StructuredOutputConfig:
      type: object
      description: Specification for structured output format. When type is object/array and no schema is provided, the response will be JSON but can have any structure. When the type is enum, you must provide an enum parameter with an array of strings as options.
      properties:
        type:
          type: string
          enum: [object, array, enum]
          description: The type of structured output
        schema:
          type: object
          description: JSON Schema definition for the output (required for object/array types with specific structure). Search for "JSON to JSON Schema" in the web to find a tool to convert any JSON into the required JSON Schema format.
        enum:
          type: array
          items:
            type: string
          description: Array of allowed values (required for enum type). Values must be of type string.
      oneOf:
        - properties:
            type:
              enum: [enum]
            enum:
              type: array
              items:
                type: string
        - properties:
            type:
              enum: [object, array]
            schema:
              type: object
        - properties:
            type:
              enum: [object, array]
    UsageExportRequest:
      type: object
      description: Request body for usage export endpoints
      properties:
        from:
          type: object
          description: Start date and timezone for the export
          properties:
            date:
              type: string
              format: date-time
              description: Start date in ISO 8601 format
              example: "2024-01-01T00:00:00.000Z"
            timezone:
              type: string
              description: Timezone for the date range
              example: "UTC"
          required:
            - date
            - timezone
        to:
          type: object
          description: End date and timezone for the export
          properties:
            date:
              type: string
              format: date-time
              description: End date in ISO 8601 format
              example: "2024-01-31T23:59:59.999Z"
            timezone:
              type: string
              description: Timezone for the date range
              example: "UTC"
          required:
            - date
            - timezone
      required:
        - from
        - to
    UsageExportModelGroupByRequest:
      allOf:
        - $ref: "#/components/schemas/UsageExportRequest"
        - type: object
          properties:
            group_by:
              type: string
              description: Optional aggregation dimension.
              enum: ["model"]
    UsageExportModelsRequest:
      allOf:
        - $ref: "#/components/schemas/UsageExportRequest"
        - type: object
          properties:
            group_by:
              type: string
              description: Optional aggregation dimension. `deployment` is only available for BYOK workspaces.
              enum: ["source", "deployment"]
    UsageExportResponse:
      type: object
      description: Successful response from usage export endpoints
      properties:
        success:
          type: boolean
          description: Indicates if the export was successful
          example: true
        data:
          type: object
          description: Export data information
          properties:
            filePath:
              type: string
              description: Path to the generated export file
              example: "agents-usage/workspace-id/agents-usage-2024-01-01-2024-01-31-abc12345.csv"
            downloadUrl:
              type: string
              format: uri
              description: Signed URL to download the export file
              example: "https://storage.example.com/signed-url"
            dataType:
              type: string
              description: Type of data exported
              enum: ["assistants", "agents", "api_keys", "users", "projects", "models", "workflows"]
              example: "assistants"
            recordCount:
              type: integer
              description: Number of records in the export
              example: 1250
            dateRange:
              type: object
              description: Actual date range of the exported data
              properties:
                from:
                  type: string
                  format: date-time
                  description: Start date of the export
                  example: "2024-01-01T00:00:00.000Z"
                to:
                  type: string
                  format: date-time
                  description: End date of the export
                  example: "2024-01-31T23:59:59.999Z"
              required:
                - from
                - to
          required:
            - filePath
            - downloadUrl
            - dataType
            - recordCount
            - dateRange
      required:
        - success
        - data
    UsageExportError:
      type: object
      description: Error response from usage export endpoints
      properties:
        message:
          type: string
          description: Detailed error message
          example: "No usage data found for the selected period"
        code:
          type: string
          description: Machine-readable error code
          example: "NOT_FOUND"
        details:
          type: object
          description: Additional error context. Oversized exports include the scanned row counts and the configured row limit.
      required:
        - message

    WorkflowRunExportResponse:
      type: object
      description: Flattened workflow run and node execution rows.
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowRunExportRow"

    WorkflowRunExportRow:
      type: object
      description: Data for one workflow run and its node execution.
      required:
        - run_id
        - run_number
        - run_status
        - run_created_at
        - run_updated_at
        - workflow_version
        - trigger_mode
        - node_execution_id
        - node_id
        - node_type
        - node_status
        - node_created_at
        - node_updated_at
        - failure_code
        - input
        - input_error
        - output
        - output_error
        - logs
        - data_redacted
        - execution_data_expired_at
      properties:
        run_id:
          type: string
          format: uuid
          description: ID of the workflow run.
        run_number:
          type: integer
          description: Sequential number of the run within the workflow.
        run_status:
          type: string
          enum: [PENDING, IN_PROGRESS, AWAITING_INPUT, COMPLETED, FAILED, CANCELLED]
          description: Status of the workflow run.
        run_created_at:
          type: string
          format: date-time
          description: Creation time of the workflow run.
        run_updated_at:
          type: string
          format: date-time
          description: Last update time of the workflow run.
        workflow_version:
          type: string
          description: Version of the workflow used for the run.
        trigger_mode:
          type: string
          nullable: true
          enum: [WEBHOOK, FORM, SCHEDULED, INTEGRATION_POLLING, MANUAL]
          description: Mode that triggered the run.
        node_execution_id:
          type: string
          format: uuid
          nullable: true
          description: ID of the node execution.
        node_id:
          type: string
          format: uuid
          nullable: true
          description: ID of the workflow node.
        node_type:
          type: string
          nullable: true
          description: Type of the workflow node.
        node_status:
          type: string
          nullable: true
          enum: [NONE, IN_PROGRESS, AWAITING_INPUT, COMPLETED, FAILED, CANCELLED]
          description: Status of the node execution.
        node_created_at:
          type: string
          format: date-time
          nullable: true
          description: Creation time of the node execution.
        node_updated_at:
          type: string
          format: date-time
          nullable: true
          description: Last update time of the node execution.
        failure_code:
          type: string
          nullable: true
          description: Failure code when the node execution fails.
        input:
          nullable: true
          description: Input data for the node execution.
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: {}
            - type: string
            - type: number
            - type: boolean
        input_error:
          nullable: true
          description: Error data for the node input.
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: {}
            - type: string
            - type: number
            - type: boolean
        output:
          nullable: true
          description: Output data for the node execution.
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: {}
            - type: string
            - type: number
            - type: boolean
        output_error:
          nullable: true
          description: Error data for the node output.
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: {}
            - type: string
            - type: number
            - type: boolean
        logs:
          nullable: true
          description: Logs generated during the node execution.
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: {}
            - type: string
            - type: number
            - type: boolean
        data_redacted:
          type: boolean
          description: Whether payload fields were omitted because access to the node data could not be established.
        execution_data_expired_at:
          type: string
          format: date-time
          nullable: true
          description: Time when detailed execution data expired.

    WorkflowRunExportError:
      type: object
      description: Error response from the Workflow Run Export API.
      properties:
        message:
          type: string
          description: Error message.
        code:
          type: string
          description: Machine-readable error code, when available.
        details:
          type: object
          additionalProperties: true
          description: Additional error context, when available.
        errors:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Validation details for malformed query parameters.
      required:
        - message

    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique audit log entry ID
        created_at:
          type: string
          format: date-time
          description: When the event occurred
        actor_id:
          type: string
          format: uuid
          nullable: true
          description: ID of the actor who performed the action
        actor_type:
          type: string
          enum: [USER, API_KEY, SYSTEM, SCIM]
          description: Type of actor
        actor_name:
          type: string
          nullable: true
          description: Human-readable actor name (e.g. email, API key name, "SCIM")
        action:
          type: string
          description: |
            Action in dot notation: `{entity}.{operation}`, where `entity` is
            the snake_case model name and `operation` is one of `created`,
            `updated`, or `deleted`.
          example: "user.updated"
        entity_type:
          type: string
          description: |
            PascalCase model name of the affected entity (e.g. `User`,
            `Workspace`, `Group`, `IntegrationConnection`).
        entity_id:
          type: string
          description: ID of the affected entity
        ip_address:
          type: string
          nullable: true
          description: IP address of the request
        user_agent:
          type: string
          nullable: true
          description: User-Agent header of the request
        changes:
          type: object
          nullable: true
          description: "Structured diff with `before` and `after` objects containing only changed fields"
          properties:
            before:
              type: object
              description: Field values before the change
            after:
              type: object
              description: Field values after the change
        snapshot:
          type: object
          nullable: true
          description: Full entity snapshot or additional event metadata (e.g. on delete/create events, or extra context like failed login details)
    AuditLogListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AuditLog"
        next_cursor:
          type: string
          format: uuid
          nullable: true
          description: Cursor for the next page, null if no more results

    # User Management API schemas
    InviteUsersRequest:
      type: object
      required:
        - users
      properties:
        users:
          type: array
          minItems: 1
          description: List of users to invite. At least one user is required.
          items:
            type: object
            required:
              - email
            properties:
              email:
                type: string
                format: email
                description: Email address of the user to invite
                example: "jane.doe@example.com"
              role:
                type: string
                enum:
                  - member
                  - editor
                  - admin
                description: "Role to assign. If omitted, defaults to `member`."
                example: "member"

    InviteUsersResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
          description: Always "success" when the request is processed
          example: "success"
        message:
          type: string
          description: Human-readable summary of the result
          example: "Invitations processed"
        successfulInvites:
          type: array
          items:
            type: string
            format: email
          description: Email addresses that were successfully invited
          example:
            - "alice@example.com"
            - "bob@example.com"
        invalidEmails:
          type: array
          items:
            type: string
          description: Email addresses that failed deeper validation (e.g., unreachable domain)
          example: []
      required:
        - status
        - message
        - successfulInvites
        - invalidEmails

    InviteUsersError:
      type: object
      properties:
        message:
          type: string
          description: Error message
          example: "Invalid request body"
        errors:
          type: array
          items:
            type: object
          description: Detailed validation errors (present on 400 responses)
        error:
          type: string
          description: Additional error details (present on 500 responses)
      required:
        - message

    UserEmailRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: Email address of the user
          example: "user@example.com"

    UpdateUserRoleRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - role
      properties:
        email:
          type: string
          format: email
          description: Email address of the active workspace member
          example: "user@example.com"
        role:
          type: string
          enum:
            - member
            - editor
            - admin
          description: Workspace system role. Values are lowercase.
          example: "editor"

    UpdateUserRoleResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
          description: Always "success" when the role is updated
          example: "success"
        email:
          type: string
          format: email
          description: Email address of the updated member
          example: "user@example.com"
        role:
          type: string
          enum:
            - member
            - editor
            - admin
          description: System role after the update
          example: "editor"
      required:
        - status
        - email
        - role

    UserManagementResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
          description: Always "success" when the request is processed
          example: "success"
        message:
          type: string
          description: Human-readable summary of the result
          example: "User deactivated"
      required:
        - status
        - message

    UserManagementError:
      type: object
      properties:
        message:
          type: string
          description: Error message
          example: "User not found or not an active member"
      required:
        - message

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: API key as Bearer token. Format "Bearer YOUR_API_KEY"
