  /automations/v1:
    get:
      operationId: listScheduledTasks
      tags:
        - Scheduled Tasks
      summary: List scheduled tasks
      description: Returns scheduled tasks created by this workspace API key, newest first.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 250
            default: 50
          description: Number of scheduled tasks to return.
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Task UUID from nextCursor in the previous response.
      responses:
        "200":
          description: Scheduled tasks returned successfully. nextCursor is present only when another page exists. Each task includes runCount.
        "400":
          description: Invalid limit or cursor
        "401":
          description: Invalid or missing API key, or the key user was not found
        "403":
          description: Missing AUTOMATION_API, a personal API key, Scheduled Tasks disabled, or the key has no access
        "405":
          description: Method not allowed
        "429":
          description: Rate limit exceeded
        "500":
          description: Internal server error
    post:
      operationId: createScheduledTask
      tags:
        - Scheduled Tasks
      summary: Create a scheduled task
      description: Creates a scheduled task owned by this workspace API key. New tasks start active. The response does not include runCount.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - name
                - prompt
                - frequency
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                prompt:
                  type: string
                  minLength: 1
                  maxLength: 120000
                frequency:
                  type: string
                  enum:
                    - MANUAL
                    - DAILY
                    - WEEKDAYS
                    - WEEKLY
                    - MONTHLY
                    - SELECTED_WEEKDAYS
                timeOfDay:
                  type: string
                  nullable: true
                  description: 24 hour HH:mm. Required unless frequency is MANUAL.
                dayOfWeek:
                  type: integer
                  minimum: 0
                  maximum: 6
                  nullable: true
                  description: Required for WEEKLY. 0 is Sunday and 6 is Saturday.
                dayOfMonth:
                  type: integer
                  minimum: 1
                  maximum: 31
                  nullable: true
                  description: Required for MONTHLY.
                daysOfWeek:
                  type: array
                  maxItems: 7
                  items:
                    type: integer
                    minimum: 0
                    maximum: 6
                  description: Required for SELECTED_WEEKDAYS.
                timezone:
                  type: string
                  nullable: true
                  maxLength: 64
                  description: IANA timezone. Empty or omitted on a scheduled frequency is stored as UTC.
                modelMode:
                  type: string
                  enum:
                    - UNSET
                    - EXPLICIT
                    - AUTO
                modelId:
                  type: string
                  format: uuid
                  nullable: true
                  description: Required in the same request when modelMode is EXPLICIT.
                assistantId:
                  type: string
                  format: uuid
                  nullable: true
                taggedAssistantId:
                  type: string
                  format: uuid
                  nullable: true
                taggedIntegrationIds:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    format: uuid
                taggedKnowledgeFolderIds:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    format: uuid
                taggedWorkflowIds:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    format: uuid
                taggedSkillSlugs:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    maxLength: 100
                attachmentIds:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    format: uuid
      responses:
        "201":
          description: Scheduled task created. The automation object does not include runCount.
        "400":
          description: Invalid body, or message AUTOMATION_LIMIT_REACHED
        "401":
          description: Invalid or missing API key, or the key user was not found
        "403":
          description: Missing AUTOMATION_API, a personal API key, Scheduled Tasks disabled, no product access, TRIAL_EXPIRED, or AUTOMATION_TAG_ACCESS_DENIED
        "405":
          description: Method not allowed
        "429":
          description: Rate limit exceeded
        "500":
          description: Internal server error

