                  description: IANA timezone. Omitted keeps the stored value. Empty is stored as UTC on a scheduled frequency.
                modelMode:
                  type: string
                  enum:
                    - UNSET
                    - EXPLICIT
                    - AUTO
                modelId:
                  type: string
                  format: uuid
                  nullable: true
                  description: Required in this request when modelMode is EXPLICIT.
                assistantId:
                  type: string
                  format: uuid
                  nullable: true
                taggedAssistantId:
                  type: string
                  format: uuid
                  nullable: true
                taggedIntegrationIds:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    format: uuid
                taggedKnowledgeFolderIds:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    format: uuid
                taggedWorkflowIds:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    format: uuid
                taggedSkillSlugs:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    maxLength: 100
                attachmentIds:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    format: uuid
      responses:
        "200":
          description: Scheduled task updated. The automation object does not include runCount.
        "400":
          description: Invalid body, message At least one field must be provided, or an incomplete merged schedule
        "401":
          description: Invalid or missing API key, or the key user was not found
        "403":
          description: Missing AUTOMATION_API, a personal API key, Scheduled Tasks disabled, no product access, or AUTOMATION_TAG_ACCESS_DENIED
        "404":
          description: Message AUTOMATION_NOT_FOUND
        "405":
          description: Method not allowed
        "429":
          description: Rate limit exceeded
        "500":
          description: Internal server error
    delete:
      operationId: deleteScheduledTask
      tags:
        - Scheduled Tasks
      summary: Delete a scheduled task
      description: Deletes a scheduled task owned by this workspace API key.
      parameters:
        - name: automationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Scheduled task deleted
        "400":
          description: Invalid task id
        "401":
          description: Invalid or missing API key, or the key user was not found
        "403":
          description: Missing AUTOMATION_API, a personal API key, Scheduled Tasks disabled, or the key has no access
        "404":
          description: Message AUTOMATION_NOT_FOUND
        "405":
          description: Method not allowed
        "429":
          description: Rate limit exceeded
        "500":
          description: Internal server error

  /automations/v1/{automationId}/pause:
    post:
      operationId: pauseScheduledTask
      tags:
        - Scheduled Tasks
      summary: Pause a scheduled task
      description: Sets active to false. The response does not include runCount.
      parameters:
        - name: automationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Scheduled task paused
        "400":
          description: Invalid task id
        "401":
          description: Invalid or missing API key, or the key user was not found
        "403":
          description: Missing AUTOMATION_API, a personal API key, Scheduled Tasks disabled, or the key has no access
        "404":
          description: Message AUTOMATION_NOT_FOUND
        "405":
          description: Method not allowed
        "429":
          description: Rate limit exceeded
        "500":
          description: Internal server error

  /automations/v1/{automationId}/resume:
    post:
      operationId: resumeScheduledTask
      tags:
        - Scheduled Tasks
      summary: Resume a scheduled task
      description: Sets active to true. The response does not include runCount.
      parameters:
        - name: automationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Scheduled task resumed
        "400":
          description: Invalid task id
        "401":
          description: Invalid or missing API key, or the key user was not found
        "403":
          description: Missing AUTOMATION_API, a personal API key, Scheduled Tasks disabled, no product access, or code TRIAL_EXPIRED with message Your trial has expired. Upgrade to continue.
        "404":
          description: Message AUTOMATION_NOT_FOUND
        "405":
          description: Method not allowed
        "429":
          description: Rate limit exceeded
        "500":
          description: Internal server error

  /automations/v1/{automationId}/run:
    post:
      operationId: runScheduledTask
      tags:
        - Scheduled Tasks
      summary: Run a scheduled task
      description: Enqueues one run and returns immediately. conversationId is null. A paused task can be run, and active stays unchanged.
      parameters:
        - name: automationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Run queued. Body is runId and conversationId null.
        "400":
          description: Invalid task id
        "401":
          description: Invalid or missing API key, or the key user was not found
        "403":
          description: Missing AUTOMATION_API, a personal API key, Scheduled Tasks disabled, no product access, or TRIAL_EXPIRED
        "404":
          description: Message AUTOMATION_NOT_FOUND
        "405":
          description: Method not allowed
        "429":
          description: Rate limit exceeded
        "500":
          description: Internal server error

  /workflows/v1/list:
    get:
      operationId: listWorkflows
      tags:
        - Workflows
      summary: List workflows
      description: Returns non-template workflows visible to the API key user.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 250
            default: 50
          description: Number of workflows to return.
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Workflow UUID from nextCursor in the previous response.
      responses:
        "200":
          description: Workflows returned successfully
        "400":
          description: Invalid query parameter
        "401":
          description: Invalid or missing API key
        "403":
          description: Missing WORKFLOW_API scope
        "429":
          description: Rate limit exceeded
        "500":
          description: Internal server error

  /workflows/v1/create:
    post:
      operationId: createWorkflow
      tags:
        - Workflows
      summary: Create a workflow
      description: Creates an inactive unpublished draft owned by the API key user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  maxLength: 60
                description:
                  type: string
                  maxLength: 500
                timezone:
                  type: string
                  description: Valid IANA timezone.
                initialTriggerKind:
                  type: string
                  enum:
                    - manual
                    - webhook
                    - scheduled
                    - form
                    - integration
                    - meeting_end
                  description: Starter trigger. Do not send this together with nodes and edges.
                nodes:
                  type: array
                  items:
                    type: object
                  description: Draft nodes. Must be sent together with edges.
                edges:
                  type: array
                  items:
                    type: object
                  description: Draft edges. Must be sent together with nodes.
                shareWith:
                  type: object
                  properties:
                    userIds:
                      type: array
                      items:
                        type: string
                        format: uuid
                      maxItems: 100
                    groupIds:
                      type: array
                      items:
                        type: string
                        format: uuid
                      maxItems: 100
                    role:
                      type: string
                      enum:
                        - user
                        - editor
                      default: editor
                limits:
                  type: object
                  description: Execution caps. Send null on a field to clear it.
                  properties:
                    monthlyCostUsd:
                      type: number
                      minimum: 1
                      maximum: 10000
                      nullable: true
                    perRunCostUsd:
                      type: number
                      minimum: 1
                      maximum: 100
                      nullable: true
                    maxExecutionsPerHour:
                      type: integer
                      minimum: 1
                      maximum: 5000
                      nullable: true
      responses:
        "200":
          description: Workflow created successfully
        "400":
          description: Invalid body, mixed initialTriggerKind with a graph, or nodes without edges
        "401":
          description: Invalid or missing API key
        "403":
          description: Missing WORKFLOW_WRITE_API scope, createWorkflows, or shareWorkflows. meeting_end without Meetings returns MEETINGS_FEATURE_FLAG_DISABLED.
        "404":
          description: A shareWith target is unknown or cannot be shared
        "429":
          description: Rate limit exceeded
        "500":
          description: Internal server error

  /workflows/v1/get:
    get:
      operationId: getWorkflow
      tags:
        - Workflows
      summary: Get a workflow
      description: Returns a workflow the API key user can view, including the draft graph, published graph, version history, and execution limits.
      parameters:
        - name: workflowId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the workflow.
      responses:
        "200":
          description: Workflow returned successfully
        "400":
          description: Invalid workflow ID
        "401":
          description: Invalid or missing API key
        "403":
          description: Missing WORKFLOW_API scope
        "404":
          description: Workflow not found, or the key user cannot view it
        "429":
          description: Rate limit exceeded
        "500":
          description: Internal server error

  /workflows/v1/update:
    patch:
      operationId: updateWorkflow
      tags:
        - Workflows
      summary: Update a workflow
      description: Updates metadata or the draft graph. Updating the draft does not publish a new version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - workflowId
              properties:
                workflowId:
                  type: string
                  format: uuid
                name:
                  type: string
                  maxLength: 60
                description:
                  type: string
                  maxLength: 500
                status:
                  type: string
                  enum:
                    - ACTIVE
                    - INACTIVE
                timezone:
                  type: string
                  description: Valid IANA timezone.
                nodes:
                  type: array
                  items:
                    type: object
                edges:
                  type: array
                  items:
                    type: object
                patch:
                  type: object
                  description: Incremental graph operations. Cannot be sent with nodes and edges or with metadata.
                limits:
                  type: object
                  description: Execution caps. Omitted fields stay unchanged. Send null on a field to clear it.
      responses:
        "200":
          description: Workflow updated successfully
        "400":
          description: Invalid body, mixed graph and metadata, nodes without edges, no fields, or activate without a published version
        "401":
          description: Invalid or missing API key
        "403":
          description: Missing WORKFLOW_WRITE_API scope or editor access. A missing workflow, a template, or a workflow in another workspace also returns this status.
        "429":
          description: Rate limit exceeded
        "500":
          description: Internal server error

  /workflows/v1/publish:
    post:
      operationId: publishWorkflow
      tags:
        - Workflows
      summary: Publish a workflow
      description: Publishes the current draft as a new production version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - workflowId
                - bumpType
              properties:
                workflowId:
                  type: string
                  format: uuid
                bumpType:
                  type: string
                  enum:
                    - major
                    - minor
                    - patch
                description:
                  type: string
                  maxLength: 255
                timezone:
                  type: string
                  description: Valid IANA timezone. Stored only when a valid name is sent.
      responses:
        "200":
          description: Workflow published successfully
        "400":
          description: Invalid body, disconnected trigger, webhook auth required, template workflow, or missing draft
        "401":
          description: Invalid or missing API key
        "403":
          description: Missing WORKFLOW_WRITE_API scope or editor access. A missing workflow, a template, or a workflow in another workspace also returns this status.
        "429":
          description: Rate limit exceeded
        "500":
          description: Internal server error

  /workflows/v1/delete:
    delete:
      operationId: deleteWorkflow
      tags:
        - Workflows
      summary: Delete a workflow
      description: Permanently deletes a workflow, including its draft and published versions.
      parameters:
        - name: workflowId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the workflow.
      responses:
        "200":
          description: Workflow permanently deleted
        "400":
          description: Invalid workflow ID
        "401":
          description: Invalid or missing API key
        "403":
          description: Missing WORKFLOW_DELETE_API scope
        "404":
          description: Workflow not found, or the key user cannot edit it
        "429":
          description: Rate limit exceeded
        "500":
          description: Internal server error

  /workflows/v1/runs:
    get:
      operationId: listWorkflowRuns
      tags:
        - Workflows
      summary: List workflow runs
      description: Returns paginated runs and node executions for a workflow the API key user can edit.
      parameters:
        - name: workflowId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the workflow.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Number of runs to return.
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Run UUID from nextCursor in the previous response.
        - name: runId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter to a single run UUID.
        - name: runMode
          in: query
          required: false
          schema:
            type: string
            enum:
              - test
              - production
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - PENDING
              - IN_PROGRESS
              - AWAITING_INPUT
              - COMPLETED
              - FAILED
              - CANCELLED
        - name: from
          in: query
          required: false
          schema:
            type: string
          description: Start of the run creation range. ISO 8601 timestamp or YYYY-MM-DD. Must be sent together with to.
        - name: to
          in: query
          required: false
          schema:
            type: string
          description: End of the run creation range. Must be equal to or later than from.
        - name: version
          in: query
          required: false
          schema:
            type: string
          description: Workflow version used for the run. Version 0 is the draft used for test runs.
      responses:
        "200":
          description: Workflow runs returned successfully
        "400":
          description: Invalid query, from without to, to earlier than from, or runMode that disagrees with version
        "401":
          description: Invalid or missing API key
        "403":
          description: Missing WORKFLOW_API scope or editor access. A missing workflow, a template, or a workflow in another workspace also returns this status.
        "429":
          description: Rate limit exceeded
        "500":
          description: Internal server error

  /workflows/{workflowId}/runs:
    get:
      operationId: exportWorkflowRunData
      tags:
        - Workflow Run Export
      summary: Export workflow run data
      description: |
        Returns flattened workflow run and node execution rows for the selected
        workflow. The date range filters workflow run creation time. The
        endpoint requires a workspace API key with the `WORKFLOW_API` scope and
        owner or editor access. Workspace administrators can access workflows
        without a workflow share, but a User share does not grant access.
      security:
        - bearerAuth: []
      parameters:
        - name: workflowId
          in: path
          required: true
          description: ID of the workflow to export.
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: true
          description: |
            Start of the export range. Use an ISO 8601 date or timestamp. A
            date-only value starts at 00:00:00.000 UTC.
          schema:
            type: string
          example: "2026-08-01"
        - name: to
          in: query
          required: true
          description: |
            End of the export range. Use an ISO 8601 date or timestamp. A
            date-only value ends at 23:59:59.999 UTC.
          schema:
            type: string
          example: "2026-08-31"
      responses:
        "200":
          description: Workflow run export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRunExportResponse"
              example:
                data:
                  - run_id: "7d2a1c4e-2f6a-4b9f-8c31-1a6d8e4f2b90"
                    run_number: 42
                    run_status: "COMPLETED"
                    run_created_at: "2026-08-12T09:15:00.000Z"
                    run_updated_at: "2026-08-12T09:15:08.000Z"
                    workflow_version: "3"
                    trigger_mode: "WEBHOOK"
                    node_execution_id: "2b8c1d4e-6f7a-4b90-9c12-3d5e7f8a1b20"
                    node_id: "9c1f2d3e-7a4b-4c58-8d19-2e6f0b7a4c31"
                    node_type: "agent"
                    node_status: "COMPLETED"
                    node_created_at: "2026-08-12T09:15:01.000Z"
                    node_updated_at: "2026-08-12T09:15:06.000Z"
                    failure_code: null
                    input:
                      customer_id: "customer-42"
                    input_error: null
                    output:
                      category: "support"
                    output_error: null
                    logs: []
                    data_redacted: false
                    execution_data_expired_at: null
        "400":
          description: Invalid request or export exceeds a configured limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRunExportError"
              example:
                message: "Workflow run exports are limited to 10,000 runs. Select a smaller date range."
                code: "WORKFLOW_RUN_EXPORT_LIMIT_EXCEEDED"
                details:
                  maxRuns: 10000
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRunExportError"
        "403":
          description: Missing scope or workflow access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRunExportError"
        "405":
          description: Method not allowed
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRunExportError"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRunExportError"

  /user-management/v1/invite:
    post:
      tags:
        - User Management
      summary: Invite users to workspace
      description: |
        Sends workspace invitations to one or more users by email. Each user can optionally
        be assigned a specific role. If no role is specified, the default role `member` is used.

        Users who are already members of the workspace are silently skipped. Users with pending
        join requests are automatically approved. Invalid email addresses are reported in the
        response but do not cause the entire request to fail.

        An invitation email is sent to each successfully invited user. If the workspace does not
        have SAML enabled, the email includes a magic link for passwordless sign-in. If SAML and
        Allow External Authentication are enabled, users outside the workspace's verified domains
        receive a magic link. SAML remains enforced for users from verified domains.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteUsersRequest"
            examples:
              single_user:
                summary: Invite a single user
                value:
                  users:
                    - email: "jane.doe@example.com"
              multiple_users_with_roles:
                summary: Invite multiple users with roles
                value:
                  users:
                    - email: "alice@example.com"
                      role: "admin"
                    - email: "bob@example.com"
                      role: "member"
                    - email: "carol@example.com"
      responses:
        "200":
          description: Invitations processed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteUsersResponse"
              examples:
                all_successful:
                  summary: All invitations sent
                  value:
                    status: "success"
                    message: "Invitations processed"
                    successfulInvites:
                      - "alice@example.com"
                      - "bob@example.com"
                    invalidEmails: []
                partial_success:
                  summary: Some emails were invalid
                  value:
                    status: "success"
                    message: "Invitations processed"
                    successfulInvites:
                      - "alice@example.com"
                    invalidEmails:
                      - "not-a-valid-email"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteUsersError"
              examples:
                missing_users:
                  summary: Missing or empty users array
                  value:
                    message: "Invalid request body"
                    errors:
                      - code: "too_small"
                        minimum: 1
                        type: "array"
                        inclusive: true
                        exact: false
                        message: "Array must contain at least 1 element(s)"
                        path: ["users"]
                invalid_role:
                  summary: Invalid role value
                  value:
                    message: "Invalid request body"
                    errors:
                      - code: "invalid_enum_value"
                        options: ["member", "editor", "admin"]
                        received: "superadmin"
                        message: "Invalid enum value. Expected 'member' | 'editor' | 'admin', received 'superadmin'"
                        path: ["users", 0, "role"]
        "401":
          description: Unauthorized - API key is missing, invalid, or the key creator was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteUsersError"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteUsersError"

  /user-management/v1/deactivate-user:
    post:
      tags:
        - User Management
      summary: Deactivate a workspace user
      description: |
        Removes a user from the workspace by email. The user immediately loses access,
        but all their data (conversations, assistants, files, integrations) is preserved
        and restored if they are re-added later.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserEmailRequest"
            examples:
              deactivate_user:
                summary: Deactivate a user
                value:
                  email: "user@example.com"
      responses:
        "200":
          description: User deactivated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserManagementResponse"
              examples:
                success:
                  summary: User deactivated
                  value:
                    status: "success"
                    message: "User deactivated"
        "401":
          description: Unauthorized - API key is missing, invalid, or the key creator was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserManagementError"
        "404":
          description: User not found or not an active member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserManagementError"
              examples:
                not_found:
                  summary: User not found
                  value:
                    message: "User not found or not an active member"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserManagementError"

  /user-management/v1/update-user-role:
    post:
      tags:
        - User Management
      summary: Change a member's system role
      description: |
        Changes an active human member's workspace system role by email.
        Send `member`, `editor`, or `admin`. Custom roles are not part of this endpoint.
        The call is authorized by the workspace API key's `USER_MANAGEMENT_API` scope
        and does not run as the person who created the key.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRoleRequest"
            examples:
              update_role:
                summary: Change a member to editor
                value:
                  email: "user@example.com"
                  role: "editor"
      responses:
        "200":
          description: Role updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateUserRoleResponse"
              examples:
                success:
                  summary: Role updated
                  value:
                    status: "success"
                    email: "user@example.com"
                    role: "editor"
        "400":
          description: Invalid role or request body, or the change would leave the workspace without an active admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserManagementError"
              examples:
                last_admin:
                  summary: Last remaining admin
                  value:
                    code: "BAD_REQUEST"
                    message: "A workspace must retain at least one active admin."
                invalid_role:
                  summary: Invalid role value
                  value:
                    message: "Invalid request"
                    errors:
                      - code: "invalid_value"
                        values:
                          - member
                          - editor
                          - admin
                        path:
                          - role
                        message: 'Invalid option: expected one of "member"|"editor"|"admin"'
        "401":
          description: API key is missing, invalid, or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserManagementError"
        "403":
          description: API key is missing the USER_MANAGEMENT_API scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserManagementError"
              examples:
                insufficient_scopes:
                  summary: Missing scope
                  value:
                    message: "Insufficient API key permissions."
                    error: "INSUFFICIENT_SCOPES"
                    details:
                      required:
                        - USER_MANAGEMENT_API
                      missing:
                        - USER_MANAGEMENT_API
        "404":
          description: User is not an active human member of this workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserManagementError"
              examples:
                not_found:
                  summary: User not found
                  value:
                    code: "NOT_FOUND"
                    message: "User is not an active member of this workspace"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserManagementError"

  /audit-logs/{workspace_id}:
    get:
      tags:
        - Audit Logs
      summary: List audit logs
      description: |
        Returns audit log entries for a workspace with cursor-based pagination.
        Requires an API key with the `AUDIT_LOG_API` scope.
      operationId: listAuditLogs
      security:
        - bearerAuth: []
      parameters:
        - name: workspace_id
          in: path
          required: true
          description: >
            Workspace UUID. Must match the workspace associated with the API key;
            requests with a mismatched workspace_id are rejected with 403.
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          required: false
          description: Cursor for pagination (ID of last item from previous page)
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: Maximum number of items to return (default 50, max 50)
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 50
        - name: from
          in: query
          required: false
          description: Start of date range filter (ISO 8601)
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: End of date range filter (ISO 8601)
          schema:
            type: string
            format: date-time
        - name: entity_type
          in: query
          required: false
          description: Filter by entity type (e.g. "User", "Workspace")
          schema:
            type: string
        - name: actor_id
          in: query
          required: false
          description: Filter by actor UUID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Paginated list of audit log entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogListResponse"
              examples:
                example:
                  value:
                    data:
                      - id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                        created_at: "2026-02-09T14:30:00Z"
                        actor_id: "u1234567-89ab-cdef-0123-456789abcdef"
                        actor_type: "USER"
                        actor_name: "jane.doe@example.com"
                        action: "user.updated"
                        entity_type: "User"
                        entity_id: "u7654321-89ab-cdef-0123-456789abcdef"
                        ip_address: "203.0.113.42"
                        user_agent: "Mozilla/5.0"
                        changes:
                          before:
                            role: "MEMBER"
                          after:
                            role: "ADMIN"
                        snapshot: null
                    next_cursor: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        "400":
          description: Invalid request parameters
        "401":
          description: Missing or invalid API key
        "403":
          description: Insufficient API key scopes or workspace_id does not match the API key's workspace
        "429":
          description: Rate limit exceeded
        "500":
          description: Internal server error

components:
  parameters:
    SkillId:
      name: skillId
      in: path
      required: true
      description: UUID of the Skill.
      schema:
        type: string
        format: uuid
    PromptId:
      name: promptId
      in: path
      required: true
      description: UUID of the prompt.
      schema:
        type: string
        format: uuid
    PromptFolderId:
      name: folderId
      in: path
      required: true
      description: UUID of the prompt folder.
      schema:
        type: string
        format: uuid
  schemas:
    Skill:
      type: object
      required:
        - id
        - name
        - slug
        - description
        - instructions
        - integrationIds
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the Skill.
        name:
          type: string
          maxLength: 64
          description: Skill name.
        slug:
          type: string
          maxLength: 100
          pattern: "^[a-z0-9-]+$"
          description: Stable Skill slug.
        description:
          type: string
          maxLength: 1024
          description: Description used to explain when the Skill should apply.
        instructions:
          type: string
          maxLength: 50000
          description: Skill instructions.
        integrationIds:
          type: array
          items:
            type: string
            format: uuid
          description: Integration IDs attached to the Skill. Each integration must be enabled in your workspace.
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp for Skill creation.
        updatedAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp for the latest Skill update.
    SkillResponse:
      type: object
      required:
        - skill
      properties:
        skill:
          $ref: "#/components/schemas/Skill"
    GetSkillResponse:
      type: object
      required:
        - skill
        - files
      properties:
        skill:
          $ref: "#/components/schemas/Skill"
        files:
          type: array
          description: Stored Skill files, ordered by path. Includes text and binary files. Does not include file contents.
          items:
            $ref: "#/components/schemas/SkillFile"
    SkillFile:
      type: object
      required:
        - path
        - sizeBytes
        - extension
        - hasScript
        - sha256
      properties:
        path:
          type: string
          description: Relative path inside the Skill.
        sizeBytes:
          type: integer
          description: File size in bytes.
        extension:
          type: string
          description: Lowercase file extension, including the leading dot.
        hasScript:
          type: boolean
          description: Whether the file is a script file (`.py`, `.sh`, `.js`, or `.ts`).
        sha256:
          type: string
          description: Lowercase SHA-256 hash of the original file bytes.
    SkillFileContent:
      allOf:
        - $ref: "#/components/schemas/SkillFile"
        - type: object
          required:
            - content
          properties:
            content:
              type: string
              description: UTF-8 file contents.
    ListSkillsResponse:
      type: object
      required:
        - skills
      properties:
        skills:
          type: array
          items:
            $ref: "#/components/schemas/Skill"
        nextCursor:
          type: string
          format: uuid
          description: Cursor for the next page, if more results are available.
    CreateSkillRequest:
      type: object
      required:
        - name
        - instructions
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 64
          minLength: 1
          description: Skill name.
        slug:
          type: string
          maxLength: 100
          pattern: "^[a-z0-9-]+$"
          description: Stable Skill slug.
        description:
          type: string
          maxLength: 1024
          description: Description used to explain when the Skill should apply.
        instructions:
          type: string
          maxLength: 50000
          minLength: 1
          description: Skill instructions.
        integrationIds:
          type: array
          items:
            type: string
            format: uuid
          description: Integration IDs to attach to the Skill.
    UpdateSkillRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 64
          minLength: 1
          description: Skill name.
        slug:
          type: string
          maxLength: 100
          pattern: "^[a-z0-9-]+$"
          description: Stable Skill slug.
        description:
          type: string
          maxLength: 1024
          description: Description used to explain when the Skill should apply.
        instructions:
          type: string
          maxLength: 50000
          minLength: 1
          description: Skill instructions.
        integrationIds:
          type: array
          items:
            type: string
            format: uuid
          description: Integration IDs to attach to the Skill. Replaces the current integration list.
    ImportSkillRequest:
      type: object
      required:
        - file
        - fileType
      properties:
        file:
          type: string
          format: binary
          description: SKILL.md, .zip, or .skill file content.
        fileType:
          type: string
          enum: [md, zip]
          description: File parser to use.
        mode:
          type: string
          enum: [create, upsert]
          default: create
          description: Whether to create a Skill or update an editable Skill with the same slug.
        integrationIds:
          type: string
          description: JSON-encoded array of integration UUIDs.
    ImportedSkillFile:
      type: object
      required:
        - path
        - sizeBytes
        - extension
        - hasScript
      properties:
        path:
          type: string
          description: File path inside the imported Skill.
        sizeBytes:
          type: integer
          description: File size in bytes.
        extension:
          type: string
          description: File extension.
        hasScript:
          type: boolean
          description: Whether the file is a script file.
    ImportSkillResponse:
      type: object
      required:
        - skill
        - files
      properties:
        skill:
          $ref: "#/components/schemas/Skill"
        files:
          type: array
          items:
            $ref: "#/components/schemas/ImportedSkillFile"
    Prompt:
      type: object
      required:
        - id
        - title
        - prompt
        - sharedWithWorkspace
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the prompt.
        title:
          type: string
          minLength: 2
          maxLength: 100
          description: Prompt title.
        prompt:
          type: string
          minLength: 2
          maxLength: 120000
          description: Prompt content.
        createdBy:
          type: string
          format: uuid
          nullable: true
          description: User ID of the prompt creator.
        promptFolderId:
          type: string
          format: uuid
          nullable: true
          description: Folder ID the prompt is assigned to.
        sharedWithWorkspace:
          type: boolean
          description: Whether the prompt is shared with the workspace.
        createdAt:
          type: string
          format: date-time
          nullable: true
          description: ISO 8601 timestamp for prompt creation.
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: ISO 8601 timestamp for the latest prompt update.
    PromptResponse:
      type: object
      required:
        - prompt
      properties:
        prompt:
          $ref: "#/components/schemas/Prompt"
    ListPromptsResponse:
      type: object
      required:
        - prompts
      properties:
        prompts:
          type: array
          items:
            $ref: "#/components/schemas/Prompt"
        nextCursor:
          type: string
          format: uuid
          description: Cursor for the next page, if more results are available.
    CreatePromptRequest:
      type: object
      required:
        - title
        - prompt
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 100
          description: Prompt title.
        prompt:
          type: string
          minLength: 2
          maxLength: 120000
          description: Prompt content.
        promptFolderId:
          type: string
          format: uuid
          description: Folder UUID to assign. Cannot be set when sharedWithWorkspace is true.
        sharedWithWorkspace:
          type: boolean
          description: Share the prompt with the workspace. Cannot be true when promptFolderId is set.
    UpdatePromptRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 100
          description: Prompt title.
        prompt:
          type: string
          minLength: 2
          maxLength: 120000
          description: Prompt content.
        promptFolderId:
          type: string
          format: uuid
          nullable: true
          description: Folder UUID to assign, or null to remove the folder.
        sharedWithWorkspace:
          type: boolean
          description: Share the prompt with the workspace.
    PromptFolder:
      type: object
      required:
        - id
        - name
        - createdBy
        - sharedWithWorkspace
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the prompt folder.
        name:
          type: string
          minLength: 2
          maxLength: 50
          description: Folder name.
        createdBy:
          type: string
          format: uuid
          description: User ID of the folder creator.
        sharedWithWorkspace:
          type: boolean
          description: Whether the folder is shared with the workspace.
        sharedWithGroupId:
          type: string
          format: uuid
          nullable: true
          description: Group ID the folder is shared with.
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp for folder creation.
        updatedAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp for the latest folder update.
    PromptFolderResponse:
      type: object
      required:
        - folder
      properties:
        folder:
          $ref: "#/components/schemas/PromptFolder"
    ListPromptFoldersResponse:
      type: object
      required:
        - folders
      properties:
        folders:
          type: array
          items:
            $ref: "#/components/schemas/PromptFolder"
        nextCursor:
          type: string
          format: uuid
          description: Cursor for the next page, if more results are available.
    CreatePromptFolderRequest:
      type: object
      required:
        - name
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
          description: Folder name.
        sharedWithWorkspace:
          type: boolean
          description: Share the folder with the workspace. Cannot be true when sharedWithGroupId is set.
        sharedWithGroupId:
          type: string
          format: uuid
          description: Group UUID to share with. Cannot be set when sharedWithWorkspace is true.
    UpdatePromptFolderRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
          description: Folder name.
        sharedWithWorkspace:
          type: boolean
          description: Share the folder with the workspace.
        sharedWithGroupId:
          type: string
          format: uuid
          nullable: true
          description: Group UUID to share with, or null to disconnect the group.
    # Agent API schemas
    AssistantActionRequest:
      type: object
      required:
        - actionId
      properties:
        actionId:
          type: string
          format: uuid
          description: UUID of the action. Create requires an enabled workspace integration. Update also accepts ids already on the draft as described on PATCH /agent/v1/update.
        requiresConfirmation:
          type: boolean
          default: true
          description: Whether to require user confirmation before executing
    AssistantInputFieldRequest:
      type: object
      required:
        - slug
        - type
        - label
        - order
      properties:
        slug:
          type: string
          minLength: 1
          maxLength: 64
          description: Unique identifier for the field
        type:
          type: string
          enum: [TEXT, MULTI_LINE_TEXT, NUMBER, CHECKBOX, FILE, SELECT, MULTI_SELECT, DATE, EMAIL]
          description: Field type
        label:
          type: string
          minLength: 1
          maxLength: 255
          description: Display label for the field
        description:
          type: string
          maxLength: 512
          description: Help text for the field
        required:
          type: boolean
          default: false
          description: Whether the field is required
        order:
          type: integer
          minimum: 0
          description: Display order
        options:
          type: array
          default: []
          items:
            type: string
            minLength: 1
            maxLength: 255
          description: Options for SELECT and MULTI_SELECT fields
        fileTypes:
          type: string
          nullable: true
          maxLength: 255
          description: Allowed file types for FILE fields
        emailDomain:
          type: string
          nullable: true
          description: Allowed email domain for EMAIL fields
    AssistantWriteRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Name of the agent or assistant
        description:
          type: string
          maxLength: 800
          description: Description of what the agent or assistant does. Send an empty string to clear it during an update.
        instruction:
          type: string
          maxLength: 50000
          description: System prompt or instructions. Send an empty string to clear it during an update.
        inputType:
          type: string
          enum: [PROMPT, STRUCTURED, INTEGRATION, SCHEDULED, WEBHOOK]
          description: Input type
        emoji:
          type: string
          nullable: true
          maxLength: 16
          description: Emoji icon
        model:
          type: string
          description: id from GET /agent/v1/models. Unique deployment names and Anthropic aliases stay valid. When several accessible rows share a name, send the UUID id.
        creativity:
          type: number
          minimum: 0
          maximum: 1
          description: Temperature for response generation
        conversationStarters:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 255
          description: Suggested prompts
        actions:
          type: array
          items:
            $ref: "#/components/schemas/AssistantActionRequest"
          description: Actions that the agent or assistant can use. On update, the array replaces the draft list.
        inputFields:
          type: array
          items:
            $ref: "#/components/schemas/AssistantInputFieldRequest"
          description: Form fields for STRUCTURED input
        webSearch:
          type: boolean
          description: Enable web search
        imageGeneration:
          type: boolean
          description: Enable image generation
        dataAnalyst:
          type: boolean
          deprecated: true
          description: Deprecated. Accepted for compatibility and ignored.
        extendedThinking:
          type: boolean
          description: Enable extended thinking
        attachments:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
          description: Attachment UUIDs
        knowledgeFolderIds:
          type: array
          items:
            type: string
            format: uuid
          description: Folder UUIDs
    AssistantCreateRequest:
      allOf:
        - $ref: "#/components/schemas/AssistantWriteRequest"
        - type: object
          required:
            - name
          properties:
            inputType:
              default: PROMPT
            creativity:
              default: 0.3
            conversationStarters:
              default: []
            actions:
              default: []
            inputFields:
              default: []
            webSearch:
              default: false
            imageGeneration:
              default: false
            dataAnalyst:
              default: false
            extendedThinking:
              default: false
            attachments:
              default: []
            knowledgeFolderIds:
              default: []
    AssistantDetails:
      type: object
      required:
        - id
        - name
        - description
        - instruction
        - emojiIcon
        - model
        - temperature
        - conversationStarters
        - inputType
        - webSearchEnabled
        - imageGenerationEnabled
        - canvasEnabled
        - extendedThinking
        - actions
        - inputFields
        - attachments
        - knowledgeFolderIds
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the agent
        name:
          type: string
          description: Name of the agent
        description:
          type: string
          nullable: true
          description: Description of what the agent does
        instruction:
          type: string
          nullable: true
          description: System prompt/instructions for the agent
        emojiIcon:
          type: string
          nullable: true
          description: Emoji icon for the agent
        model:
          type: string
          nullable: true
          description: Model ID to use (see Models for Agent API)
        temperature:
          type: number
          minimum: 0
          maximum: 1
          description: Temperature/creativity setting for response generation
        conversationStarters:
          type: array
          items:
            type: string
          description: Array of suggested prompts to help users get started
        inputType:
          type: string
          enum: [PROMPT, STRUCTURED, INTEGRATION, SCHEDULED, WEBHOOK]
          description: Input type for the agent
        webSearchEnabled:
          type: boolean
          description: Whether web search capability is enabled
        imageGenerationEnabled:
          type: boolean
          description: Whether image generation capability is enabled
        canvasEnabled:
          type: boolean
          description: Whether canvas capability is enabled
        extendedThinking:
          type: boolean
          description: Whether extended thinking is enabled. Only supported on models that expose this capability; enabling it on an unsupported model returns a 400 error.
        actions:
          type: array
          items:
            type: object
            required:
              - actionId
              - requiresConfirmation
            properties:
              actionId:
                type: string
                format: uuid
                description: UUID of a live action. Missing and soft-deleted ids are omitted. Live unavailable actions remain.
              requiresConfirmation:
                type: boolean
                description: Whether user confirmation is required before executing
          description: Live actions on the returned version. Missing and soft-deleted ids are omitted. Live unavailable actions remain.
        inputFields:
          type: array
          items:
            type: object
            required:
              - type
              - label
              - description
              - required
              - order
            properties:
              type:
                type: string
                enum:
                  [TEXT, MULTI_LINE_TEXT, NUMBER, CHECKBOX, FILE, SELECT, MULTI_SELECT, DATE, EMAIL]
                description: Field type
              label:
                type: string
                description: Display label for the field
              description:
                type: string
                nullable: true
                description: Help text for the field
              required:
                type: boolean
                description: Whether the field is required
              order:
                type: integer
                minimum: 0
                description: Display order (0-indexed)
          description: Array of form field definitions (for STRUCTURED input type)
        attachments:
          type: array
          items:
            type: string
            format: uuid
          description: Array of attachment UUIDs associated with the agent
        knowledgeFolderIds:
          type: array
          items:
            type: string
            format: uuid
          description: Array of Folder UUIDs associated with the agent
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the agent was created
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the agent was last updated
    # OpenAI schemas
    ChatCompletionRequestMessageContentPart:
      oneOf:
        - $ref: "#/components/schemas/ChatCompletionRequestMessageContentPartText"
        - $ref: "#/components/schemas/ChatCompletionRequestMessageContentPartImage"
      x-oaiExpandable: true
    ChatCompletionRequestMessageContentPartImage:
      type: object
      title: Image content part
      properties:
        type:
          type: string
          enum: ["image_url"]
          description: The type of the content part.
        image_url:
          type: object
          properties:
            url:
              type: string
              description: Either a URL of the image or the base64 encoded image data.
              format: uri
            detail:
              type: string
              description: Specifies the detail level of the image. Learn more in the [Vision guide](https://platform.openai.com/docs/guides/vision/low-or-high-fidelity-image-understanding).
              enum: ["auto", "low", "high"]
              default: "auto"
          required:
            - url
      required:
        - type
        - image_url
    ChatCompletionRequestMessageContentPartText:
      type: object
      title: Text content part
      properties:
        type:
          type: string
          enum: ["text"]
          description: The type of the content part.
        text:
          type: string
          description: The text content.
      required:
        - type
        - text
    ChatCompletionRequestMessage:
      oneOf:
        - $ref: "#/components/schemas/ChatCompletionRequestSystemMessage"
        - $ref: "#/components/schemas/ChatCompletionRequestUserMessage"
        - $ref: "#/components/schemas/ChatCompletionRequestAssistantMessage"
        - $ref: "#/components/schemas/ChatCompletionRequestToolMessage"
        - $ref: "#/components/schemas/ChatCompletionRequestFunctionMessage"
      x-oaiExpandable: true
    ChatCompletionRequestSystemMessage:
      type: object
      title: System message
      properties:
        content:
          description: The contents of the system message.
          type: string
        role:
          type: string
          enum: ["system"]
          description: The role of the messages author, in this case `system`.
        name:
          type: string
          description: An optional name for the participant. Provides the model information to differentiate between participants of the same role.
      required:
        - content
        - role
    ChatCompletionRequestUserMessage:
      type: object
      title: User message
      properties:
        content:
          description: |
            The contents of the user message.
          oneOf:
            - type: string
              description: The text contents of the message.
              title: Text content
            - type: array
              description: An array of content parts with a defined type, each can be of type `text` or `image_url` when passing in images. You can pass multiple images by adding multiple `image_url` content parts. Image input is only supported when using the `gpt-4-visual-preview` model.
              title: Array of content parts
              items:
                $ref: "#/components/schemas/ChatCompletionRequestMessageContentPart"
              minItems: 1
          x-oaiExpandable: true
        role:
          type: string
          enum: ["user"]
          description: The role of the messages author, in this case `user`.
        name:
          type: string
          description: An optional name for the participant. Provides the model information to differentiate between participants of the same role.
      required:
        - content
        - role
    ChatCompletionRequestAssistantMessage:
      type: object
      title: Assistant message
      properties:
        content:
          nullable: true
          type: string
          description: |
            The contents of the assistant message. Required unless `tool_calls` or `function_call` is specified.
        role:
          type: string
          enum: ["assistant"]
          description: The role of the messages author, in this case `assistant`.
        name:
          type: string
          description: An optional name for the participant. Provides the model information to differentiate between participants of the same role.
        tool_calls:
          $ref: "#/components/schemas/ChatCompletionMessageToolCalls"
        function_call:
          type: object
          deprecated: true
          description: "Deprecated and replaced by `tool_calls`. The name and arguments of a function that should be called, as generated by the model."
          nullable: true
          properties:
            arguments:
              type: string
