aid: langdock
name: Langdock
description: 'Langdock is an enterprise AI platform — "The Platform for AI Adoption"
  — that lets organizations deploy model-agnostic AI across their workforce through
  Chat, Workflows, Agents, Skills, Integrations, and a public API. The platform is
  EU-hosted on Microsoft Azure with ISO 27001 and SOC 2 Type II certification and GDPR
  alignment, and supports multi-tenant SaaS, single-tenant SaaS, bring-your-own-cloud,
  and on-premise Kubernetes deployment. The Langdock API exposes provider-compatible
  completion and embedding endpoints for OpenAI, Anthropic, Google Gemini, and Mistral
  models across EU and US regions, alongside first-party Agents, Skills, Knowledge
  Folder, Integrations, Audit Logs, Usage Export, and User Management APIs, plus a
  hosted Model Context Protocol server that exposes workspace agents as MCP tools.'
